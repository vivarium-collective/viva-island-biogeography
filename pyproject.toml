[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-island-biogeography"
version = "0.1.0"
description = "Process-bigraph port of the island-biogeography metacommunity model (Lotka-Volterra islands + distance-stochastic migration)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=1.0",
    "process-bigraph>=1.8",
    "numpy>=1.24",
    "plotly>=5.0",
    "pyyaml",
    "jsonschema",
    "jinja2",
    "bigraph-viz>=2.0.3",
    "pypdf>=4.0",
    "matplotlib",
    "vivarium-workbench",
    # Imported directly by viva_island_biogeography.evaluators* and
    # run_persistence (register_derived_scalars computers + register_run). Pinned
    # to git main below for the #83 run_readiness fix (field-based derived
    # measures), which is merged but not yet in a tagged release.
    "viva-discovery-engine",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-island-biogeography"
Issues = "https://github.com/vivarium-collective/viva-island-biogeography/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_island_biogeography"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-discovery-engine = { git = "https://github.com/vivarium-collective/discovery-engine.git", branch = "main" }

[tool.uv]
# vivarium-workbench pins viva-discovery-engine>=0.3,<0.4 by SEMVER POLICY (not a
# known incompatibility). The #83 run_readiness fix is only on DE main (0.6.0),
# so override that cap to resolve DE from git main until a release carries #83.
override-dependencies = [
    "viva-discovery-engine @ git+https://github.com/vivarium-collective/discovery-engine.git@main",
]
