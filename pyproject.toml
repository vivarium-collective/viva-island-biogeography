[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-island-biogeography"
version = "0.2.0"
description = "Island-biogeography investigation workspace (Lotka-Volterra islands + distance-stochastic migration). The simulator lives in viva-island-biogeography-sim, pinned per study for reproducibility."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # The simulator: processes, composites, evaluators, viz. Pinned by git tag
    # (see [tool.uv.sources]) so every study runs against this exact version;
    # each study.yaml also records the pin under `simulator:`. Brings the compute
    # core (process-bigraph, bigraph-schema, numpy, plotly) transitively.
    "viva-island-biogeography-sim",
    # Study framework + report/dashboard tooling used by the WORKSPACE (not the
    # simulator): workbench dashboards, discovery-engine grading/evaluators, and
    # the report renderers. discovery-engine is pinned to git main below for the
    # #83 run_readiness fix (merged, not yet in a tagged release).
    "vivarium-workbench",
    "viva-discovery-engine",
    "pyyaml",
    "jsonschema",
    "jinja2",
    "bigraph-viz>=2.0.3",
    "pypdf>=4.0",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-island-biogeography"
Issues = "https://github.com/vivarium-collective/viva-island-biogeography/issues"

# Metadata-only wheel: the simulator package now lives in its own distribution
# (viva-island-biogeography-sim). This repo is the investigation workspace and
# ships no importable package of its own.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
viva-island-biogeography-sim = { git = "https://github.com/vivarium-collective/viva-island-biogeography-sim.git", tag = "0.1.1" }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
viva-discovery-engine = { git = "https://github.com/vivarium-collective/discovery-engine.git", branch = "main" }

[tool.uv]
# vivarium-workbench pins viva-discovery-engine>=0.3,<0.4 by SEMVER POLICY (not a
# known incompatibility). The #83 run_readiness fix is only on DE main (0.6.0),
# so override that cap to resolve DE from git main until a release carries #83.
override-dependencies = [
    "viva-discovery-engine @ git+https://github.com/vivarium-collective/discovery-engine.git@main",
]
