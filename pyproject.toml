[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-island-biogeography"
version = "0.1.0"
description = "Process-bigraph port of the island-biogeography metacommunity model (Lotka-Volterra islands + distance-stochastic migration)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=1.0",
    "process-bigraph>=1.8",
    "numpy>=1.24",
    "plotly>=5.0",
    "pyyaml",
    "jsonschema",
    "jinja2",
    "bigraph-viz>=2.0.3",
    "pypdf>=4.0",
    "matplotlib",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/viva-island-biogeography"
Issues = "https://github.com/vivarium-collective/viva-island-biogeography/issues"

[tool.hatch.build.targets.wheel]
packages = ["viva_island_biogeography"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
